name: Work item
description: Propose a reviewable unit of project work.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the verified problem to solve.
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired observable outcome
      description: Describe what must be observably true when the work is complete.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the criteria that must pass before completion can be claimed.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: State what is explicitly excluded. Write "None" if no non-goals are identified.
    validations:
      required: true

  - type: textarea
    id: decisions-needed
    attributes:
      label: Decisions needed
      description: List unresolved decisions. Write "None" if no decisions remain.
    validations:
      required: true

  - type: textarea
    id: evidence-plan
    attributes:
      label: Evidence plan
      description: Explain how repository facts, external facts, and results will be verified.
    validations:
      required: true

  - type: textarea
    id: quality-gates
    attributes:
      label: Applicable quality gates
      description: List executable gates and explain any gates that are not applicable.
    validations:
      required: true

  - type: textarea
    id: review-scope
    attributes:
      label: Review scope
      description: Identify repository-authored, generated, and third-party material requiring review.
    validations:
      required: true
