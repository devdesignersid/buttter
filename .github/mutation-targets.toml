version = 1
behavior_paths = [
  ".github/mutation-targets.toml",
  ".github/quality-targets.toml",
  ".github/workflows/mutation-testing.yml",
  "tools/repo-policy/Cargo.toml",
]

[[groups]]
name = "mutation-cli"
target = "repo-policy"
product_file = "tools/repo-policy/src/main.rs"
function_regex = "^run$"
test_paths = []
behavior_paths = []
test_target = "mutation_plan"

[[groups]]
name = "mutation-planner"
target = "repo-policy"
product_file = "tools/repo-policy/src/quality.rs"
function_regex = "^(mutation_plan|validate_mutation_results|load_mutation_manifest|validate_mutation_manifest|validate_sorted_paths|require_regular_file|valid_identifier|read_changed_paths|plan_mutations|mutation_file|validate_outcomes)$"
test_paths = ["tools/repo-policy/tests/mutation_plan.rs"]
behavior_paths = [
  ".github/mutation-targets.toml",
  ".github/workflows/mutation-testing.yml",
  "tools/repo-policy/Cargo.toml",
]
test_target = "mutation_plan"

[[groups]]
name = "pr-body"
target = "repo-policy"
product_file = "tools/repo-policy/src/main.rs"
function_regex = "^(is_substantive_conclusion|validate_body|validate_pre_completion_review|validate_unverified_items)$"
test_paths = [
  "tools/repo-policy/tests/file_scope.rs",
  "tools/repo-policy/tests/pr_body.rs",
  "tools/repo-policy/tests/pr_body_policy_workflow.rs",
]
behavior_paths = []
test_target = "pr_body"

[[groups]]
name = "pr-evidence"
target = "repo-policy"
product_file = "tools/repo-policy/src/main.rs"
function_regex = "^(parse_command_evidence|parse_file_evidence|validate_performance_evidence|validate_repository_evidence|validate_repository_path)$"
test_paths = ["tools/repo-policy/tests/pr_body.rs"]
behavior_paths = []
test_target = "pr_body"

[[groups.exceptions]]
outcome = "unviable"
pattern = "replace validate_repository_evidence.*Default::default"
reason = "The generated replacement requires FileEvidence to implement Default, but an empty file reference is not a valid domain value."

[[groups.exceptions]]
outcome = "unviable"
pattern = "replace parse_file_evidence.*Default::default"
reason = "The generated replacement requires FileEvidence to implement Default, but an empty file reference is not a valid domain value."

[[groups]]
name = "pr-external-evidence"
target = "repo-policy"
product_file = "tools/repo-policy/src/main.rs"
function_regex = "^(days_in_month|is_leap_year|valid_https_url|validate_date|validate_external_evidence)$"
test_paths = ["tools/repo-policy/tests/pr_body.rs"]
behavior_paths = []
test_target = "pr_body"

[[groups]]
name = "pr-local-file-evidence"
target = "repo-policy"
product_file = "tools/repo-policy/src/main.rs"
function_regex = "^(validate_file_contents|validate_local_file_evidence)$"
test_paths = ["tools/repo-policy/tests/pr_body.rs"]
behavior_paths = []
test_target = "pr_body"

[[groups]]
name = "pr-remote-file-evidence"
target = "repo-policy"
product_file = "tools/repo-policy/src/main.rs"
function_regex = "^(github_api_raw|percent_encode_path|run_validate_pr_body|validate_remote_file_evidence)$"
test_paths = [
  "tools/repo-policy/tests/pr_remote_evidence.rs",
  "tools/repo-policy/tests/work_item.rs",
]
behavior_paths = []
test_target = "pr_remote_evidence"

[[groups]]
name = "quality"
target = "repo-policy"
product_file = "tools/repo-policy/src/quality.rs"
function_regex = "^(find_target|run_target|validate_structure)$"
test_paths = [
  "tools/repo-policy/tests/quality_manifest.rs",
  "tools/repo-policy/tests/quality_workflow.rs",
]
behavior_paths = [".github/quality-targets.toml"]
test_target = "quality_manifest"
